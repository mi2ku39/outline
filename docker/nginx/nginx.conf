map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=30s ipv6=off;
  set $outline_upstream http://outline:80;

  client_max_body_size 0;
  etag on;
  open_file_cache max=10000 inactive=60s;
  open_file_cache_errors on;
  open_file_cache_min_uses 2;
  open_file_cache_valid 120s;
  sendfile on;
  tcp_nopush on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  location @outline {
    proxy_pass $outline_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location /realtime {
    proxy_pass $outline_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /static/ {
    root /usr/share/nginx/html;
    try_files $uri =400;

    access_log off;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Service-Worker-Allowed "/";
  }

  location ~ ^/(images|fonts|email)/ {
    root /usr/share/nginx/html;
    try_files $uri @outline;

    access_log off;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=604800";
  }

  location ~ ^/locales/([^/]+)\.json$ {
    root /usr/share/nginx/html;
    try_files /locales/$1/translation.json @outline;

    access_log off;
    add_header Cache-Control "public, max-age=604800";
  }

  location /locales/ {
    return 404;
  }

  location / {
    try_files /__no_static_file__ @outline;
  }
}
